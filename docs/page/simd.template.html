<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIMD explicite et classement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
/* Plan : note de méthode sobre, une colonne de lecture (~68 caractères) ; les tableaux s'élargissent dans leur propre
   conteneur. Quatre couleurs de classe (scalaire, vecteurs du langage, intrinsèques de la plateforme, importées),
   distinctes de l'accent des liens et titres. Motif : les 16 voies d'un vecteur AVX-512 d'entiers 32 bits. */
:root {
  --paper: #f5f6f8;
  --card: #ffffff;
  --ink: #17202b;
  --muted: #586273;
  --rule: #d6dce4;
  --accent: #1d4fa8;
  --accent-soft: #e5ecf8;
  --c-s: #5f6878;
  --c-s-bg: #eceef2;
  --c-v: #0d6e5f;
  --c-v-bg: #dcf1ec;
  --c-p: #8a5200;
  --c-p-bg: #f7ead3;
  --c-m: #a3283f;
  --c-m-bg: #f8dfe4;
  --up: #1b7a3d;
  --down: #b3261e;
  --font-display: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12161c;
    --card: #1a2029;
    --ink: #e6eaf0;
    --muted: #9aa5b5;
    --rule: #2e3744;
    --accent: #8fb4ff;
    --accent-soft: #1f2b40;
    --c-s: #b3bccb;
    --c-s-bg: #2a313c;
    --c-v: #6fd6c2;
    --c-v-bg: #143530;
    --c-p: #f0b25a;
    --c-p-bg: #3a2a12;
    --c-m: #ff8fa3;
    --c-m-bg: #3d1a22;
    --up: #6ad08a;
    --down: #ff8a80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #12161c;
  --card: #1a2029;
  --ink: #e6eaf0;
  --muted: #9aa5b5;
  --rule: #2e3744;
  --accent: #8fb4ff;
  --accent-soft: #1f2b40;
  --c-s: #b3bccb;
  --c-s-bg: #2a313c;
  --c-v: #6fd6c2;
  --c-v-bg: #143530;
  --c-p: #f0b25a;
  --c-p-bg: #3a2a12;
  --c-m: #ff8fa3;
  --c-m-bg: #3d1a22;
  --up: #6ad08a;
  --down: #ff8a80;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.6;
}
main { max-width: 980px; margin: 0 auto; padding: 40px 20px 72px; display: grid; gap: 48px; }
.prose { max-width: 68ch; }
header { display: grid; gap: 14px; }
.eyebrow { font-family: var(--font-mono); font-size: 13px; letter-spacing: 0.02em; color: var(--muted); margin: 0; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; line-height: 1.2; margin: 0; }
h1 { font-size: clamp(30px, 5vw, 42px); font-weight: 700; }
h2 { font-size: 26px; font-weight: 700; }
h3 { font-size: 19px; font-weight: 600; }
p { margin: 0; }
section { display: grid; gap: 16px; }
.lede { font-size: 19px; color: var(--muted); max-width: 62ch; }
a { color: var(--accent); text-underline-offset: 2px; }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
code { font-family: var(--font-mono); font-size: 0.88em; background: var(--accent-soft); padding: 1px 5px; border-radius: 4px; }
.lanes { display: grid; gap: 6px; max-width: 520px; }
.lanes .row { display: grid; grid-template-columns: repeat(16, 1fr); gap: 3px; }
.lanes .row span { height: 12px; border-radius: 2px; background: var(--c-v-bg); border: 1px solid var(--c-v); }
.lanes p { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.decided { background: var(--card); border: 1px solid var(--rule); border-left: 4px solid var(--accent); border-radius: 8px; padding: 20px 22px; display: grid; gap: 10px; }
.decided ul, .prose ul { margin: 0; padding-left: 20px; display: grid; gap: 8px; }
.pillars { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.pillar { background: var(--card); border: 1px solid var(--rule); border-radius: 8px; padding: 18px; display: grid; gap: 8px; align-content: start; }
.pillar .w { font-family: var(--font-display); font-size: 34px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.pillar .w small { font-family: var(--font-body); font-size: 14px; font-weight: 500; color: var(--muted); }
.pillar p { font-size: 15px; }
.pillar .sub { font-size: 14px; color: var(--muted); }
.bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; border: 1px solid var(--rule); }
.bar span { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 14px; color: var(--muted); }
.chip { display: inline-block; font-family: var(--font-mono); font-size: 12px; font-weight: 500; padding: 1px 7px; border-radius: 10px; border: 1px solid currentColor; white-space: nowrap; }
.chip.s { color: var(--c-s); background: var(--c-s-bg); }
.chip.v { color: var(--c-v); background: var(--c-v-bg); }
.chip.p { color: var(--c-p); background: var(--c-p-bg); }
.chip.m { color: var(--c-m); background: var(--c-m-bg); }
.classes { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
.cls { background: var(--card); border: 1px solid var(--rule); border-radius: 8px; padding: 16px; display: grid; gap: 8px; align-content: start; }
.cls p { font-size: 15px; }
.cls .ex { font-size: 14px; color: var(--muted); }
blockquote { margin: 0; padding: 14px 18px; background: var(--card); border: 1px solid var(--rule); border-left: 4px solid var(--c-v); border-radius: 6px; font-size: 16px; display: grid; gap: 6px; max-width: 76ch; }
blockquote cite { font-style: normal; font-size: 13px; color: var(--muted); font-family: var(--font-mono); }
.scroll { overflow-x: auto; border: 1px solid var(--rule); border-radius: 8px; background: var(--card); }
table { border-collapse: collapse; width: 100%; font-size: 14.5px; font-variant-numeric: tabular-nums; }
th, td { padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font-weight: 600; font-size: 13px; color: var(--muted); background: var(--paper); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; white-space: nowrap; }
td.lang { font-weight: 600; white-space: nowrap; }
.sc { color: var(--muted); }
.mv { font-size: 12px; font-family: var(--font-mono); margin-left: 4px; }
.mv.up { color: var(--up); }
.mv.down { color: var(--down); }
.note { font-size: 14px; color: var(--muted); max-width: 76ch; }
.groups { display: grid; gap: 10px; }
.group { display: grid; grid-template-columns: minmax(170px, 260px) 1fr; gap: 6px 16px; padding: 12px 14px; background: var(--card); border: 1px solid var(--rule); border-radius: 8px; }
.group .k { font-weight: 600; font-size: 15px; }
.group .n { font-family: var(--font-display); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.group .langs { font-size: 15px; }
.group .langs em { color: var(--muted); font-style: normal; }
footer { font-size: 14px; color: var(--muted); display: grid; gap: 8px; }
footer ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
@media (max-width: 560px) {
  body { font-size: 16px; }
  main { padding: 28px 16px 56px; gap: 40px; }
  .group { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>
</head>
<body>
<main>
<!--CONTENT-->
</main>
</body>
</html>
