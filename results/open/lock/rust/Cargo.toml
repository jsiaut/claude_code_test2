# Projet des sondes et des formes de Rust (probes/open/rust) ; versions figées
[package]
name = "open_probe"
version = "0.1.0"
edition = "2024"

# v4, point 6 (docs/V4_OPEN.md, 4) : sondes de la grille ouverte de Rust ; versions de results/open/versions.txt
[dependencies]
bumpalo = { version = "=3.20.4", features = ["collections"] }
fearless_simd = "=1.2.0"
rayon = "=1.12.0"
cordyceps = "=0.3.5"
core_affinity = "=0.8.3"
ndarray = "=0.17.2"
memmap2 = "=0.9.12"
libc = "=0.2.191"
crossbeam = "=0.8.5"
hwlocality-sys = "=0.7.2"
cache-padded = "=1.3.0"

[profile.release]
opt-level = 3
codegen-units = 1
