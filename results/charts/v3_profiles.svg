<svg xmlns="http://www.w3.org/2000/svg" width="760" height="599" viewBox="0 0 760 599" role="img" aria-label="Plafond et code naturel par langage, sur deux machines">
<style>
  svg { --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781; --grid: #e1e0d9; --axis: #c3c2b7;
        --s1: #2a78d6; --band: #b7d3f6; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  @media (prefers-color-scheme: dark) {
    svg { --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781; --grid: #2c2c2a; --axis: #383835;
          --s1: #3987e5; --band: #184f95; }
  }
  .bg { fill: var(--surface); } .t1 { fill: var(--ink); font-size: 15px; font-weight: 600; }
  .t2 { fill: var(--ink2); font-size: 12px; } .lab { fill: var(--ink); font-size: 12px; }
  .tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .grid { stroke: var(--grid); stroke-width: 1; } .axis { stroke: var(--axis); stroke-width: 1; }
  .band { fill: var(--band); } .ua { stroke: var(--ink2); stroke-width: 2; stroke-linecap: round; }
  .dot { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .dot2 { fill: var(--muted); stroke: var(--surface); stroke-width: 2; }
  .sep { stroke: var(--axis); stroke-width: 1; }
</style>
<rect class="bg" width="760" height="599"/>
<text class="t1" x="16" y="26">Plafond et code naturel, par langage et par machine</text>
<text class="t2" x="16" y="46">E : meilleur code écrit pour la machine ; D1 : code naturel. Chacun est rapporté au meilleur langage de chaque</text>
<text class="t2" x="16" y="62">mesure, sur chaque machine. Lignes dans l'ordre du classement final. K5 vient de la machine 3.</text>
<line class="ua" x1="16" x2="42" y1="84" y2="84"/><circle class="dot" cx="29" cy="84" r="5"/><text class="t2" x="50" y="88">machine 1 (Cascade Lake) et son IC à 95 %</text>
<circle class="dot2" cx="330" cy="84" r="4.5"/><text class="t2" x="342" y="88">machine 3 (Emerald Rapids), un processus par mesure</text>
