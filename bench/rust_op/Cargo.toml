# v4, point 6 (docs/V4_OPEN.md, 5.2) : construction _op de Rust : ms.rs (copie de bench/rust_cv) et les crates de la
# piste ouverte, mêmes options que la construction publiée (opt-level 3, target-cpu=native par RUSTFLAGS, une unité de
# code) ; versions de results/open/versions.txt.
[package]
name = "ms"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ms"
path = "ms.rs"

[dependencies]
bumpalo = "=3.20.4"
cache-padded = "=1.3.0"
crossbeam = "=0.8.5"
libc = "=0.2.191"

[profile.release]
opt-level = 3
codegen-units = 1
debug = false
